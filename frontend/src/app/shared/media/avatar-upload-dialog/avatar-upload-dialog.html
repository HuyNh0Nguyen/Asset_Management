<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <input #fileInput class="avatar-upload-input" type="file" [accept]="accept" (change)="onFileSelected($event)" />

  @if (bitmap(); as source) {
    <app-image-cropper [source]="source" />
    <p class="dialog-note">Kéo ảnh để chọn vùng hiển thị, dùng thanh trượt để phóng to</p>
  } @else {
    <button type="button" class="avatar-upload-pick" (click)="fileInput.click()">
      <mat-icon>add_photo_alternate</mat-icon>
      <span>Chọn ảnh JPEG, PNG hoặc WebP (tối đa 5 MB)</span>
    </button>
  }

  @if (error()) {
    <p class="dialog-alert dialog-alert-text">{{ error() }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  @if (bitmap()) {
    <button mat-button type="button" [disabled]="uploading()" (click)="fileInput.click()">Chọn ảnh khác</button>
  }
  <button mat-button type="button" mat-dialog-close [disabled]="uploading()">Hủy</button>
  <button mat-flat-button type="button" [disabled]="!bitmap() || uploading()" (click)="save()">
    {{ uploading() ? 'Đang lưu...' : 'Lưu ảnh' }}
  </button>
</mat-dialog-actions>
