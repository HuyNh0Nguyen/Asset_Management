<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p class="dialog-message">{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false">{{ data.cancelLabel ?? 'Hủy' }}</button>
  <button mat-flat-button type="button" [class.button-danger]="isDanger" [mat-dialog-close]="true">
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
