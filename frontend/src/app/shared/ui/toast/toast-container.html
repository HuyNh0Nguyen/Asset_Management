<div class="toast-container" aria-live="polite">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="toast-item"
      [class]="toastClass[toast.type]"
      [attr.role]="toast.type === ToastType.ERROR ? 'alert' : 'status'"
    >
      <mat-icon class="toast-icon">{{ toastIcon[toast.type] }}</mat-icon>
      <span class="toast-message">{{ toast.message }}</span>
      <button mat-icon-button type="button" aria-label="Đóng thông báo" (click)="toastService.dismiss(toast.id)">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  }
</div>
