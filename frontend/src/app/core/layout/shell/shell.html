<mat-toolbar class="shell-header">
  @if (!isDesktop()) {
    <button mat-icon-button type="button" aria-label="Mở menu" (click)="drawer.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
  }
  <a class="shell-brand">
    <img class="shell-brand-logo" [src]="brandLogo" alt="" width="32" height="32" />
    <span>Quản lý tài sản</span>
  </a>
  <span class="shell-spacer"></span>
  
  <!-- Tài khoản: họ tên + Đổi mật khẩu / Đăng xuất -->
  <button mat-button type="button" class="shell-user" [matMenuTriggerFor]="userMenu" aria-label="Tài khoản">
    <mat-icon class="material-symbols-outlined">account_circle</mat-icon>
    <span class="shell-user-name">{{ fullName() }}</span>
    <mat-icon class="shell-user-caret" iconPositionEnd>expand_more</mat-icon>
  </button>
  <mat-menu #userMenu="matMenu" xPosition="before">
    <a mat-menu-item [routerLink]="changePasswordUrl">
      <mat-icon>lock_reset</mat-icon>
      <span>Đổi mật khẩu</span>
    </a>
    <button mat-menu-item type="button" [disabled]="loggingOut()" (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Đăng xuất</span>
    </button>
  </mat-menu>
</mat-toolbar>

<mat-sidenav-container class="shell-body">
  <mat-sidenav #drawer class="shell-sidenav" [mode]="isDesktop() ? 'side' : 'over'" [opened]="isDesktop()">
    <mat-nav-list>
      @for (item of menuItems(); track item.url) {
        <a mat-list-item [routerLink]="item.url" routerLinkActive="shell-nav-active" (click)="onNavigate(drawer)">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="shell-content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
