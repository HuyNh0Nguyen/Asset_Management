# ===== LOCAL: Ung dung chay bang IntelliJ / mvnw, ha tang trong infra/local =====
# Gia tri gia dung chung voi compose - thieu tep thi dung khi khoi dong va bao duong dan
spring.config.import=file:../infra/local/.env[.properties]

app.db.host=localhost
spring.datasource.password=${MARIADB_PASSWORD}
spring.jpa.show-sql=true

spring.rabbitmq.host=localhost
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS}

app.storage.internal-endpoint=http://localhost:9000
# Trinh duyet di qua ng serve (:4200), KHONG phai :9000 - chu ky URL chua host nay
app.storage.public-endpoint=http://localhost:4200
app.storage.access-key=${MINIO_APP_USER}
app.storage.secret-key=${MINIO_APP_PASSWORD}

app.jwt.secret=${LOCAL_JWT_SECRET}
app.public-base-url=http://localhost:4200
app.seed-demo=true
