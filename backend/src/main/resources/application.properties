# ===== Dung chung moi moi truong - khong host, khong bi mat =====
spring.application.name=asset-management
spring.profiles.default=local

# CSDL - profile chi doi app.db.host
spring.datasource.url=jdbc:mariadb://${app.db.host}:3306/asset?connectionTimeZone=Asia/Ho_Chi_Minh&forceConnectionTimeZoneToSession=true
spring.datasource.username=asset
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# db/demo them bang ma khi app.seed-demo=true
spring.flyway.locations=classpath:db/migration

# Jackson
spring.jackson.time-zone=Asia/Ho_Chi_Minh
# Truong la bi tu choi, khong am tham bo qua
spring.jackson.deserialization.fail-on-unknown-properties=true

# Anh tai len <= 5 MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Phan trang
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Broker sap thi that bai nhanh, khong treo luong gui
spring.rabbitmq.connection-timeout=5s

# Pool cho @Async (publish email sau commit)
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=500

# springdoc - moi duong dan duoi /api; sap khoa + pretty de ban chup hop dong on dinh
springdoc.api-docs.path=/api/v3/api-docs
springdoc.swagger-ui.path=/api/docs
springdoc.override-with-generic-response=false
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true

# Actuator - chi health; broker sap khong lam backend "khong khoe"
management.endpoints.web.exposure.include=health
management.health.rabbit.enabled=false

# Ung dung
app.storage.bucket=asset-images
app.storage.presigned-ttl=15m
# Client ky URL khong goi mang hoi vung
app.storage.signing-region=us-east-1
app.seed-demo=false
