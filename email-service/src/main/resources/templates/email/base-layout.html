<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)" lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="${subject}">Quản lý tài sản</title>
</head>
<body style="margin:0;padding:0;background:#f5f6f8;font-family:Arial,Helvetica,sans-serif;color:#1f2328;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f6f8;padding:24px 0;">
  <tr>
    <td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0"
             style="max-width:600px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;">
        <!-- Đầu thư: đỏ Viettel -->
        <tr>
          <td style="background:#ee0033;color:#ffffff;padding:16px 24px;font-size:18px;font-weight:bold;">
            Quản lý tài sản
          </td>
        </tr>
        <tr>
          <td style="padding:24px;font-size:14px;line-height:1.6;">
            <p style="margin:0 0 16px;">Xin chào <b th:text="${recipientName}">Nguyễn Văn An</b>,</p>
            <div th:replace="${content}">Nội dung riêng của từng sự kiện</div>
            <p th:if="${link}" style="margin:24px 0 0;">
              <a th:href="${link}"
                 style="display:inline-block;background:#ee0033;color:#ffffff;text-decoration:none;padding:10px 20px;border-radius:6px;">
                Mở hệ thống
              </a>
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 24px;font-size:12px;color:#5f6368;border-top:1px solid #e3e5e8;">
            Email tự động từ hệ thống Quản lý tài sản — vui lòng không trả lời.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
