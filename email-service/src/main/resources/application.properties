spring.application.name=asset-email-service
spring.profiles.default=local
spring.main.web-application-type=none

# ===== CSDL: chi doc / chot email_logs (bang cua backend, schema do Flyway backend quan ly) =====
# Cung chuoi JDBC voi backend; profile chi doi app.db.host
spring.datasource.url=jdbc:mariadb://${app.db.host}:3306/asset?connectionTimeZone=Asia/Ho_Chi_Minh&forceConnectionTimeZoneToSession=true
spring.datasource.username=asset
# Listener toi da 4 luong, moi luong giu mot ket noi tai mot thoi diem
spring.datasource.hikari.maximum-pool-size=4
# CSDL sap -> loi sau 5s de hoan message (D4), khong treo luong listener 30s
spring.datasource.hikari.connection-timeout=5000
# Khong tao / sua schema; email-service khong co Flyway
spring.jpa.hibernate.ddl-auto=none
# Khoi dong duoc khi CSDL chua len - message toi som se duoc hoan
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

spring.rabbitmq.connection-timeout=5s
# Luoi an toan: message lam listener loi khong bi dua lai hang doi vo han
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=4

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ===== SMTP Gmail: giong het o local va dev =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Khong bao gio gui App Password qua ket noi chua ma hoa
spring.mail.properties.mail.smtp.starttls.required=true
# Kiem ten may chu trong chung chi TLS
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
# Timeout (ms): JavaMail mac dinh cho vo han
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Giu dong bo voi backend; converter cua listener tu tat rieng de nhan truong la (RabbitConfig)
spring.jackson.deserialization.fail-on-unknown-properties=true

app.email.from-address=${spring.mail.username}
# = "Quan ly tai san" - gia tri co dau phai viet \uXXXX
app.email.from-name=Qu\u1ea3n l\u00fd t\u00e0i s\u1ea3n
# Toi da 3 lan thu lai, cach 5 phut
app.email.max-retries=3
app.email.retry-delay=5m
# Toi da 12 lan hoan khi CSDL sap (12 x 5 phut ~ 1 gio); qua tran thi bo message, dong van PENDING
app.email.max-deferrals=12
