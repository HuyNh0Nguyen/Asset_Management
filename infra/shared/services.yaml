# Định nghĩa gốc — không chạy trực tiếp; local/dev lấy qua extends
services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      MARIADB_DATABASE: asset              # cùng tên ở mọi môi trường
      MARIADB_USER: asset
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - ./mariadb/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 12
      start_period: 30s

  # Image có sẵn từ dự án CV. minio/minio và minio/mc đã bị xóa khỏi Docker Hub nên KHÔNG pull được:
  # pull_policy never -> thiếu image thì báo "No such image" thay vì "pull access denied" khó hiểu
  minio:
    image: minio/minio:latest              
    pull_policy: never
    restart: unless-stopped
    command: server /data --console-address ":9001"
    healthcheck:
      # Image chính thức không có wget/curl, chỉ có mc
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  minio-init:
    image: minio/mc:latest
    pull_policy: never
    restart: "no"
    entrypoint: ["/bin/sh", "/init/init.sh"]
    volumes:
      # Đường dẫn tương đối tính từ thư mục chứa services.yaml (infra/shared)
      - ./minio/init.sh:/init/init.sh:ro

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq                     # đổi tên node là mồ côi volume
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 12
      start_period: 30s