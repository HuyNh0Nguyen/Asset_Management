name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B package

  email-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: email-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B package

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Client FE không được cũ hơn contracts/openapi.json
      - name: Kiểm client API khớp hợp đồng
        run: npm run gen:api && git diff --exit-code src/app/api
      - run: npm run lint
      - run: npm run build

  # Build thẳng từ Dockerfile, không qua compose (compose dev cố ý dừng khi thiếu bí mật)
  images:
    runs-on: ubuntu-latest
    needs: [backend, email-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t asset-backend:ci backend
      - run: docker build -t asset-email-service:ci email-service
      - run: docker build -t asset-frontend:ci frontend